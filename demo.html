<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cloudi AI 2API Demo</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--acc:#7c5cff;--ok:#3ddc84;--err:#ff5c7c;--tx:#e8e9f0;--dim:#8b8fa3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px;max-width:960px;margin:auto}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{color:var(--dim);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:.9rem}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:wait}
input,textarea{background:#12141c;border:1px solid #2a2e3e;color:var(--tx);border-radius:8px;padding:9px 12px;font-size:.9rem;width:100%}
textarea{min-height:70px;resize:vertical}
label{font-size:.8rem;color:var(--dim)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.ok{background:rgba(61,220,132,.15);color:var(--ok)}
.err{background:rgba(255,92,124,.15);color:var(--err)}
.wait{background:rgba(124,92,255,.15);color:var(--acc)}
pre{background:#0b0d13;border-radius:8px;padding:10px;font-size:.75rem;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-all}
img.result{max-width:100%;border-radius:8px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
td,th{padding:6px 8px;border-bottom:1px solid #2a2e3e;text-align:left}
th{color:var(--dim);font-weight:500}
</style>
</head>
<body>
<h1>🔓 Cloudi AI 2API <span class="badge ok">demo</span></h1>
<div class="sub">upstream: https://nano-banana.leansoft-ai.com · AES-256-CBC X-Client-Auth · Firebase Remote Config 动态密钥</div>

<div class="card">
  <div class="row"><button onclick="bootstrap()">① 设备注册 + 配额</button><span id="sessInfo"></span></div>
  <div id="sessOut"></div>
</div>

<div class="card">
  <label>② Prompt 文生图（/image/prompt，受上游配额墙）</label>
  <div class="row"><textarea id="prompt" placeholder="a cute red apple on a wooden table">a cute red apple on a wooden table</textarea></div>
  <div class="row"><button id="genBtn" onclick="generate()">生成</button><span id="genInfo"></span></div>
  <div id="genOut"></div>
</div>

<div class="card">
  <label>③ 图片增强 /image/enhance（已验证可用）</label>
  <div class="row"><input type="file" id="file" accept="image/jpeg,image/png"></div>
  <div class="row"><button id="enhBtn" onclick="enhance()">上传并增强</button><span id="enhInfo"></span></div>
  <div id="enhOut"></div>
</div>

<div class="card">
  <label>④ 压测（并发 N 次设备注册，测上游承载）</label>
  <div class="row"><input id="n" type="number" value="5" min="1" max="30" style="width:90px"><button id="stBtn" onclick="stress()">开跑</button><span id="stInfo"></span></div>
  <div id="stOut"></div>
</div>

<script>
const API='';
async function jf(u,o){const r=await fetch(API+u,o);return{code:r.status,data:await r.json().catch(()=>({}))}}

async function bootstrap(){
  const el=document.getElementById('sessOut');el.innerHTML='<span class="badge wait">注册中…</span>';
  const{data}=await jf('/v1/session');
  document.getElementById('sessOut').innerHTML=`<pre>${JSON.stringify(data,null,1)}</pre>`;
  if(data.quota)document.getElementById('sessInfo').innerHTML=`<span class="badge ok">SaasID ${data.saas_id} · uses ${data.quota.usesLeft} · coins ${data.quota.coins}</span>`;
}

async function generate(){
  const b=document.getElementById('genBtn');b.disabled=true;
  document.getElementById('genInfo').innerHTML='<span class="badge wait">请求中…</span>';
  const{code,data}=await jf('/v1/image/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('prompt').value})});
  document.getElementById('genInfo').innerHTML=`<span class="badge ${code==200?'ok':'err'}">HTTP ${code}</span>`;
  document.getElementById('genOut').innerHTML=`<pre>${JSON.stringify(data,null,1)}</pre>`;
  b.disabled=false;
}

async function enhance(){
  const f=document.getElementById('file').files[0];
  const btn=document.getElementById('enhBtn');btn.disabled=true;
  document.getElementById('enhInfo').innerHTML='<span class="badge wait">上传中…</span>';
  let body={};
  if(f){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});body.image_b64=b64;}
  const{code,data}=await jf('/v1/image/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('enhInfo').innerHTML=`<span class="badge ${data.success?'ok':'err'}">${data.success?'success':'fail'}</span>`;
  let html=`<pre>${JSON.stringify(data,null,1)}</pre>`;
  if(data.success&&data.data&&data.data.image_url)html+=`<img class="result" src="${data.data.image_url}">`;
  document.getElementById('enhOut').innerHTML=html;
  btn.disabled=false;
}

async function stress(){
  const n=+document.getElementById('n').value,btn=document.getElementById('stBtn');
  btn.disabled=true;const t0=performance.now();
  const rs=await Promise.all(Array.from({length:n},()=>jf('/v1/session')));
  const ms=(performance.now()-t0).toFixed(0);
  const okN=rs.filter(r=>r.data&&r.data.saas_id).length;
  const rows=rs.map((r,i)=>`<tr><td>#${i+1}</td><td>${r.data.saas_id||'-'}</td><td>${r.data.quota?r.data.quota.usesLeft:'-'}</td><td>${r.code}</td></tr>`).join('');
  document.getElementById('stInfo').innerHTML=`<span class="badge ${okN==n?'ok':'err'}">${okN}/${n} 成功 · ${ms}ms</span>`;
  document.getElementById('stOut').innerHTML=`<table><tr><th>并发</th><th>SaasID</th><th>usesLeft</th><th>HTTP</th></tr>${rows}</table>`;
  btn.disabled=false;
}
bootstrap();
</script>
</body>
</html>
